<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoogLab — Learn Synthesis</title>
  <meta name="description" content="Learn subtractive synthesis step by step on a simulated Minimoog-style synthesizer.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">moog<span>lab</span></span>
      <span class="tag">learn synthesis on a simulated Model D</span>
    </div>
    <div class="progress" title="Overall progress">
      <div id="overall" class="bar"><i></i></div>
      <span id="overall-text"></span>
    </div>
    <button id="power" class="power" type="button">Start audio</button>
  </header>

  <nav id="levels" class="levels" aria-label="Levels"></nav>

  <main class="layout">
    <article class="lesson">
      <p id="lesson-kicker" class="kicker"></p>
      <h1 id="lesson-title"></h1>
      <div id="lesson-theory" class="theory"></div>
      <h2>Try this</h2>
      <ul id="lesson-tips" class="tips"></ul>
      <h2>Challenges <span id="challenge-count" class="count"></span></h2>
      <ul id="challenges" class="challenges"></ul>
      <p class="hint">Challenges complete while a note is sounding — so you hear the result.</p>
      <div class="lesson-nav">
        <button id="prev-level" type="button">← Previous</button>
        <button id="next-level" type="button">Next level →</button>
      </div>
      <button id="reset-progress" class="link" type="button">Reset progress</button>
    </article>

    <section class="synth" aria-label="Synthesizer">
      <div class="flow" id="flow" aria-label="Signal flow">
        <div data-block="vco"><b>VCO</b><small>oscillator</small></div>
        <div data-block="mix"><b>MIX</b><small>mixer</small></div>
        <div data-block="vcf"><b>VCF</b><small>ladder filter</small></div>
        <div data-block="vca"><b>VCA</b><small>amplifier</small></div>
        <div data-block="out"><b>OUT</b><small>speaker</small></div>
        <div data-block="env" class="mod"><b>ENV</b><small>contours</small></div>
        <div data-block="lfo" class="mod"><b>LFO</b><small>modulation</small></div>
      </div>

      <div class="case">
        <div class="panel-tools">
          <div id="presets" class="presets" hidden>
            <select id="preset-select" aria-label="Presets"></select>
            <button id="save-patch" type="button">Save patch</button>
          </div>
          <button id="reset" type="button">Reset patch</button>
        </div>
        <div id="panel" class="panel"></div>
      </div>

      <div class="viz-grid">
        <figure class="viz" data-viz="scope"><figcaption>Oscilloscope <small>shape over time</small></figcaption><canvas id="viz-scope"></canvas></figure>
        <figure class="viz" data-viz="spectrum"><figcaption>Spectrum <small>harmonics</small></figcaption><canvas id="viz-spectrum"></canvas></figure>
        <figure class="viz" data-viz="filter"><figcaption>Ladder response <small id="fc-readout"></small></figcaption><canvas id="viz-filter"></canvas></figure>
        <figure class="viz" data-viz="env"><figcaption>Contours <small>ADSR over time</small></figcaption><canvas id="viz-env"></canvas></figure>
      </div>
    </section>
  </main>

  <footer class="keys-area">
    <div class="keys-left">
      <div id="perf" class="wheels" hidden>
        <label class="wheel"><input id="bend-wheel" type="range" min="-2" max="2" step="0.01" value="0" aria-label="Pitch bend"><span>Pitch</span></label>
        <label class="wheel"><input id="mod-wheel" type="range" min="0" max="1" step="0.01" value="0" aria-label="Modulation wheel"><span>Mod</span></label>
      </div>
      <div class="octave">
        <button id="oct-down" type="button" aria-label="Octave down">◀ Z</button>
        <span id="octave-readout"></span>
        <button id="oct-up" type="button" aria-label="Octave up">X ▶</button>
      </div>
      <div id="note-readout" class="note-readout">—</div>
    </div>
    <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/dsp.js"></script>
  <script src="js/params.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/viz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
